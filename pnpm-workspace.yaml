packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks postinstall scripts by default. Each entry here is a deliberate decision, not a
# convenience — a package allowed to run install scripts can run arbitrary code on this machine
# and in CI.
#
#   sharp           — Next.js's image optimiser; needs its native binary built (PH-0.4).
#   esbuild         — the bundler under Vite and Storybook 10; ships a platform binary (PH-0.4).
#   prisma          — the CLI; prepares its query engine (PH-0.6).
#   @prisma/engines — downloads the query engine binary itself (PH-0.6).
#   unrs-resolver   — native resolver under eslint-import-resolver-typescript, which
#                     eslint-plugin-boundaries needs to map nodenext `.js` specifiers to `.ts`
#                     files. Without it every cross-element dependency resolves to unknown and
#                     the boundary rules silently match nothing (PH-0.16).
allowBuilds:
  unrs-resolver: true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  # The three below arrive with `renovate`, installed at PH-0.10 for `renovate-config-validator`.
  # All three are DENIED: none is needed to parse and validate a config file, and each would run
  # native compilation on every install, in CI and inside the Docker deps stage.
  #
  #   core-js-pure    — its install script only prints a funding notice.
  #   dtrace-provider — optional native tracing for bunyan; absent, logging still works.
  #   re2             — a native regex engine renovate uses for untrusted patterns. Without it
  #                     renovate falls back to JS RegExp, which is irrelevant here: we run the
  #                     validator, never the bot.
  #
  # Denying rather than approving is the whole point of this list. Proven by running the validator
  # after the denial — fitness case 37.
  #
  # @swc/core arrives with @storybook/test-runner's jest transform. Denied for the same reason:
  # its install script fetches a prebuilt binary, and pnpm already resolves the right
  # platform package as an optional dependency. Proven by running the runner after the denial.
  '@swc/core': false
  core-js-pure: false
  dtrace-provider: false
  re2: false

minimumReleaseAgeExclude:
  - jsdom@30.0.1

patchedDependencies:
  jsdom@30.0.0: patches/jsdom@30.0.0.patch

# ── Security overrides and accepted advisories (PH-0.30, BR-1468) ────────────────────────────
#
# `pnpm audit --prod` runs in CI. These entries are what it takes to make that gate meaningful
# rather than permanently red — a check that is always failing is a check nobody reads.

overrides:
  # Three advisories (GHSA-qx2v-qp2m-jg93, GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849) all resolve
  # at postcss >= 8.5.18. Next pulls in 8.4.31 transitively while 8.5.23 was ALREADY in the tree
  # for another consumer, so this forces one copy rather than adding a new dependency. Same major,
  # and the version was already being loaded by something else in this install.
  postcss: '8.5.23'
  # 2026-08-20 — the audit gate went red on advisories published since the 2026-08-01 push, not
  # on any change in this repository. Three have in-major patches and are forced here; two are
  # ACCEPTED below with their retire conditions. All ranged so an unrelated major elsewhere in
  # the tree is not silently rewritten.
  #
  # fast-uri < 3.1.5 — host confusion via backslash (GHSA-7p8r-x3mc-p8w7). Reached through the
  # prisma CLI chain, which SHIPS in the API image (migrations run at container start). Patch bump.
  'fast-uri@3': '3.1.5'
  # nanoid < 3.3.18 — custom generators can loop indefinitely (GHSA-2v37-7h3g-55p8). Reached
  # through next > postcss, which ships to users. Patch bump within the 3.x line postcss expects.
  'nanoid@3': '3.3.18'
  # js-yaml 4.x < 4.3.1 — quadratic CPU on !!omap (GHSA-5p4m-2wfm-xmqj). Lint-time chain
  # (stylelint > cosmiconfig), but an in-major patch exists, and fixing beats accepting whenever
  # the fix is a patch bump — the postcss precedent above.
  'js-yaml@4': '4.3.1'

auditConfig:
  # Not "ignored" — ACCEPTED, each with the reason it cannot be fixed here and the condition that
  # retires it. An entry that outlives its condition is worse than no entry, so both are dated and
  # carried in STATUS.md §8 as SB-31 rather than living only in this file.
  ignoreGhsas:
    # sharp 0.34.5 — libvips CVE-2026-33327. Patched at sharp >= 0.35.0, which `next` 16.2.12 does
    # not yet accept; forcing it overrides a native image pipeline Next controls, which is a larger
    # risk than the advisory. RETIRE when a Next release accepts sharp 0.35 — Renovate will open
    # that PR under the manual-review rule.
    - GHSA-f88m-g3jw-g9cj
    # brace-expansion — DoS via unbounded expansion. Reached only through
    # eslint-plugin-jsx-a11y > minimatch, a LINT-TIME dependency that is never shipped to a user
    # and never processes untrusted input. It appears under `--prod` because pnpm treats every
    # workspace project's own `dependencies` as production, and `packages/config` correctly
    # declares its plugins there. RETIRE when jsx-a11y ships a patched minimatch.
    - GHSA-mh99-v99m-4gvg
    # brace-expansion again, 2026-08-20 (GHSA-rgw5-rvv9-x895) — the successor advisory to the one
    # above, two ranges (<1.1.18 and 4.x). Both paths are the same class: packages/config's eslint
    # and jsx-a11y chains, lint-time, never shipped, never fed untrusted input. The 4.x range's
    # only patched line is 5.x, and forcing a major under eslint's minimatch for a lint-time DoS
    # buys risk, not safety. RETIRE when the eslint chain ships brace-expansion >= 5.0.9 / 1.1.18
    # on its own — Renovate surfaces that bump.
    - GHSA-rgw5-rvv9-x895
    # deepmerge-ts < 8 — stack exhaustion on recursive object graphs (GHSA-ggr8-5vv4-36mx).
    # Reached only through prisma > @prisma/config, which merges THIS REPOSITORY'S OWN
    # prisma.config.ts — the input is never attacker-controlled, so the "vulnerability" here is a
    # self-DoS requiring us to commit a recursive config. It does ship in the API image (the CLI
    # runs migrations at container start), which is exactly why it is accepted rather than
    # overridden: forcing a cross-major bump under prisma's config loader risks the deploy path
    # itself. RETIRE when prisma bumps @prisma/config to deepmerge-ts >= 8.
    - GHSA-ggr8-5vv4-36mx
