# `PH-0.10` — lint → typecheck → test → build → push to ghcr.io.
#
# No deploy step. `PH-0.11` adds that once `PH-0.9` has hardened Coolify; this workflow ends at a
# tagged image in the registry, which is `BR-885`'s requirement — nothing builds on the server.
#
# **This is the only gate on `main`.** Branch protection is unavailable on private repositories on
# the current plan, so nothing server-side prevents a direct push and nothing blocks a merge on a
# red run. The pre-commit hook and commitlint are the local line of defence and are bypassable with
# `--no-verify`. Treat a red run here as a broken `main`, not as a blocked pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run per ref. A superseded push has nothing to say that its successor does not.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the publish job widens it for itself alone (`BR-1704`).
permissions:
  contents: read

env:
  # `BR-1810` — identical to `engines.node`, `.nvmrc`, `packageManager` and every Dockerfile base.
  NODE_VERSION: '24.18.0'
  PNPM_VERSION: '11.17.0'

  # Turborepo reports anonymous usage data by default. This is a public repository and nobody opted
  # in, so it is off. The variable is the only repository-scoped switch — `turbo telemetry disable`
  # writes to a per-user config outside the repo, which is why it is also in the local-setup notes
  # rather than assumed.
  TURBO_TELEMETRY_DISABLED: '1'
  # Same reasoning for the Next.js build, which the web image also sets.
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # `PH-1.1` — the API now has a schema, and `schema-conformance.spec.ts` verifies it column by
    # column against `10` using the LIVE catalogs. That suite FAILS rather than skips without a
    # database (`BR-1830`): a conformance suite that reports green having checked nothing is worse
    # than no suite, so CI has to supply one.
    #
    # Same image as `docker-compose.yml` and the same pin (`BR-1591`). A CI database on a
    # different major version would verify a schema nobody deploys.
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: josam
          POSTGRES_PASSWORD: josam_ci_ephemeral
          POSTGRES_DB: josam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U josam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # `REDIS_URL` is REQUIRED by `env.ts` — `z.string().url()` with no default — so anything
      # that calls `loadEnv()` fails without it. Same pin as `docker-compose.yml` (`BR-1591`).
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # ── Environment, at JOB level rather than per step ──────────────────────────────────────
    #
    # `PH-1.4` post-mortem. These were set on two individual steps, and `JWT_SECRET` on none at
    # all, so CI went red for four consecutive tasks while every local gate passed. Per-step env
    # is a footgun: every new step that touches the app silently starts without it.
    #
    # The rule now: anything `env.ts` REQUIRES (no `.default()`, no `.optional()`) belongs here.
    # Today that is `REDIS_URL` and `JWT_SECRET`; `DATABASE_URL` is read directly by Prisma and
    # by the suites that assert against real rows.
    env:
      DATABASE_URL: postgresql://josam:josam_ci_ephemeral@localhost:5432/josam?schema=public
      REDIS_URL: redis://localhost:6379
      # Ephemeral, CI-only, and deliberately not a secret: it signs nothing that leaves this run.
      # A repository secret here would make the workflow unrunnable on a fork for no gain.
      JWT_SECRET: ci-ephemeral-signing-key-not-used-outside-this-workflow-0123456789

    steps:
      - uses: actions/checkout@v5.1.0

      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        # `--frozen-lockfile` fails rather than silently resolving differently from the lockfile,
        # which is the entire reason the lockfile is committed. It also applies `patches/` —
        # `jsdom@30.0.0` is patched, and without it six specs fail inside node_modules (`SB-26`).
        #
        # This step also runs `apps/api`'s `postinstall`, which is where `prisma generate` lives.
        # The Prisma client is generated and gitignored, so a clean checkout has no `PrismaClient`
        # type and every `no-unsafe-*` rule fires at once — 21 errors across three files, which is
        # how CI run #2 failed. Making it a `postinstall` rather than a step here is deliberate:
        # a CI-only step would have fixed CI and left a clean local clone broken, and the whole
        # lesson is that the two must not diverge (`BR-1838`).
        run: pnpm install --frozen-lockfile

      # ── Generated inputs, before ANYTHING verifies ────────────────────────────────────────
      #
      # `packages/ui` and `apps/web` resolve `@josam/tokens` and `@josam/i18n` through their built
      # `dist/`, which is gitignored. Without it, `lint:hook` produces 38 errors of exactly the
      # same shape as the Prisma failure — `no-unsafe-*` cascading from types that cannot resolve.
      #
      # `turbo run lint` would build them itself via `^build`. `lint:hook` would not, and it only
      # passed because the turbo step happened to run first. That is a real defect standing one
      # step away: reorder these two and CI fails the way run #2 did. Building the shared packages
      # explicitly means neither path depends on the other having gone first (`BR-1838`).
      - name: Produce every generated input
        # Self-sufficient on purpose: it regenerates the Prisma client too, rather than trusting
        # that `postinstall` ran. Both are cheap and cached, and a step named "generated inputs"
        # that produces only some of them is the same defect wearing a reassuring label.
        run: |
          pnpm turbo run db:generate
          pnpm turbo run build --filter=./packages/*

      # ── Lint, BOTH ways ──────────────────────────────────────────────────────────────────
      #
      # `SB-15`, and this is not redundancy. The two invocations see different things:
      #
      #   `turbo run lint`  runs `eslint .` INSIDE each workspace, so each has its own tsconfig
      #                     root and its own parser project.
      #   `lint:hook`       runs eslint ONCE from the repository root across every workspace,
      #                     exactly as the pre-commit hook does.
      #
      # At `PH-0.2` the second caught a real parser defect — a missing `tsconfigRootDir`, reported
      # as "multiple candidate TSConfigRootDirs" on 14 files — that the first structurally cannot
      # see. A CI that only runs turbo goes green on code the hook rejects, and the bug resurfaces
      # in a pull request instead of locally.
      - name: Lint (per workspace, via turbo)
        run: pnpm lint

      - name: Lint (root-level, the pre-commit hook path)
        run: pnpm lint:hook

      - name: Lint styles
        run: pnpm lint:css

      - name: Check formatting
        # `--check`, never `--write`. A CI job that reformats is a CI job that can hide a diff from
        # the person who has to review it (`BR-1834` — assert an autofixer's output, do not run it).
        run: pnpm format:check

      - name: Check module boundaries
        run: pnpm check:deps

      - name: Validate the Renovate config
        # Renovate REJECTS unknown keys rather than ignoring them, so an invalid config does not
        # degrade into a weaker policy — it stops the bot dead with a configuration-error issue and
        # opens no PRs at all. That failure is invisible from inside the repository: everything
        # here stays green while the dependency policy quietly does nothing (`BR-1838`).
        run: pnpm check:renovate

      - name: Check translation catalogs
        # `BR-524` — Arabic defines the key space, so a missing Arabic string must not compile and
        # an English key with no Arabic counterpart is a catalog that lies about its coverage.
        run: pnpm check:catalogs

      - name: Check the ledgers
        # Every summary figure is recomputed from its own table, and every deferral names a task
        # ID that has NOT started. Phase 0 shipped five stale figures and two mis-owned rows,
        # each invisible to reading the summary and visible only row by row. A number written
        # once and never recomputed is the same class of defect as a check that loads and
        # enforces nothing (`BR-1830`) — it sits where a check should be and reports something
        # reassuring. Proven by fitness cases 41 and 42.
        run: pnpm check:ledgers

      - name: Check foreign-key order against task order
        # `BR-1842` — a dependency graph derived from feature grouping rather than data structure
        # will be circular, and the migration still APPLIES. The failure surfaces at the first
        # INSERT, as a seed error, tasks after the ordering decision that caused it. Compares 16's
        # own `Schema:` rows against 10's CREATE TABLE bodies. Proven by fitness case 43.
        run: pnpm check:fk-order

      - name: Typecheck
        run: pnpm typecheck

      # `BR-1838` — the schema is generated state. Verification that depends on it is not
      # verification until it has been produced from a clean checkout, which is what this is.
      - name: Apply migrations, validate the environment, seed
        run: |
          pnpm --filter @josam/api exec prisma migrate deploy
          pnpm --filter @josam/api build

          # Fails on a MISSING VARIABLE, naming it, before 40 spec failures bury the cause.
          # `BR-1830` — the environment is a mechanism, and a mechanism has to be asked. It runs
          # after `build` because it loads the COMPILED schema rather than a second copy of it.
          node -e "
            const { loadEnv } = require('./apps/api/dist/config/env.js');
            loadEnv();
            console.log('env OK — every variable env.ts requires is present');
          " || {
            echo '::error::The CI environment does not satisfy apps/api/src/config/env.ts.'
            echo '::error::Anything env.ts REQUIRES belongs in the job-level env block.'
            exit 1
          }

          pnpm --filter @josam/api db:seed

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # `BR-1486` — initial JS ≤ 200 KB gzipped. After `build`, because a budget checked against
      # an absent build is a budget that always passes (`BR-1838`). The config resolves the entry
      # chunks from Next's build manifest rather than globbing every chunk, which would measure
      # the whole application and call it the first load.
      - name: Check the bundle budget
        run: pnpm check:size

      # `BR-1468` — every dependency verified before installation. `--prod` because a
      # devDependency advisory does not reach a user, and `|| true` is deliberately ABSENT: an
      # advisory in something we ship stops the build.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level moderate

      # ── Criterion 6 — axe over every story, four combinations, in a real browser ─────────
      #
      # `BR-1571`. Not jsdom: `data-theme` and `dir` change no DOM, so the entire difference
      # between the four combinations is CSS, and jsdom applies none. A jsdom loop would assert the
      # same markup four times and report four passes (`BR-1830`).
      #
      # The first run of this sweep found 40 failures across 49 stories, including a page with no
      # base surface at all — near-white text on white at 1.04:1 — and a `--text-muted` token that
      # had never been contrast-tested.
      - name: Install Chromium for the story sweep
        run: pnpm --filter @josam/web exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm --filter @josam/web run build:storybook

      - name: axe over every story, 4 theme × direction combinations
        run: pnpm --filter @josam/web run test:a11y

      # ── The proof that the enforcement is real ───────────────────────────────────────────
      #
      # `BR-1831`. 35 deliberate violations, each of which must fail the build. Three of the
      # original fitness functions were **silently dead** when written — they loaded cleanly and
      # enforced nothing — and only this suite found them. A proof that re-runs when somebody
      # remembers is not a safety net, so it runs on every push next to lint.
      #
      # It writes and deletes files under `packages/` and `apps/`, so it runs after `build`: a
      # failure mid-case would otherwise leave a violation file behind for the build to compile.
      - name: Verify fitness functions (BR-1725)
        run: pnpm verify:fitness

      - name: Fail if the fitness run left the tree dirty
        # Every case is supposed to restore the tree before the next runs. If one aborted midway,
        # a violation file is still on disk — and a green run that leaves the repository modified
        # is a green run nobody should trust.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::verify:fitness left the working tree dirty — a case aborted mid-way"
            git status --porcelain
            exit 1
          fi

  publish:
    name: build and push images
    needs: verify
    # Pull requests get the gate, not the registry. An image per PR fills the package store with
    # tags nothing will ever deploy, and a fork PR cannot be given a write token safely.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      # One app's failure must not cancel the other's push: a half-published pair is recoverable,
      # a cancelled one leaves no record of which succeeded.
      fail-fast: false
      matrix:
        app: [api, web]

    steps:
      - uses: actions/checkout@v5.1.0

      - uses: docker/setup-buildx-action@v3.12.0

      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow-scoped token. No founder-held secret is involved, which is why this task
          # needed nothing from the server or from a credential store.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          # `BR-886` — the SHA tag is the rollback handle: redeploying a previous release is
          # redeploying its tag. `latest` is a convenience for `docker pull` and must never be
          # what a deployment references, because it names a different image every push.
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub's cache backend, scoped per app so the two do not evict each other.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Report the deployable tag
        run: |
          echo "### \`${{ matrix.app }}\` image published" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Deploy and roll back by SHA tag, never by `latest` (BR-886):' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'ghcr.io/${{ github.repository }}/${{ matrix.app }}:sha-${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
